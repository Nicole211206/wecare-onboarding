[project]
name = "wecare-onboarding-backend"
version = "0.1.0"
description = "Backend FastAPI do wecare-onboarding (migrado de Cloudflare Worker + KV)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
