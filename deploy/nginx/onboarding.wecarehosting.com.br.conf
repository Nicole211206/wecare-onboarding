# Versão HTTP-only pra instalar ANTES do certbot (ver deploy/README.md passo
# 9) — rodar `certbot --nginx -d onboarding.wecarehosting.com.br` depois de
# confirmar que este bloco funciona; o certbot reescreve o arquivo sozinho
# pra adicionar o server{} 443 + redirect 80→443 (mesmo formato final do
# claire.wecarehosting.com.br.conf). Não escrever os caminhos ssl_certificate
# à mão — nginx -t falha se os arquivos do Let's Encrypt ainda não existem.
server {
    listen 80;
    server_name onboarding.wecarehosting.com.br;

    # /save pode chegar com o estado inteiro (fotos novas em base64) —
    # folga generosa pra não truncar upload de várias fotos de uma vez.
    client_max_body_size 30M;

    root /home/jarvis/apps/wecare-onboarding;
    index index.html;

    # Backend FastAPI — todas as rotas de API do worker.js migrado (ver
    # ANALISE-MIGRACAO.md seção 2). Regex único em vez de um bloco por rota
    # (mesmo efeito do padrão claire-project, menos repetição).
    location ~ ^/(load|save|stats|onboarding-stats|form-load|form-save|vistoria-load|vistoria-save|vistoria-midia|imovel-dados|foto|imovel-fotos|jarvis-pending|jarvis-notify|extrair-formulario|analisar-drive|drive-debug)$ {
        proxy_pass http://127.0.0.1:18791;
        include /etc/nginx/proxy_params_onboarding;
    }

    # Upload de foto/vídeo bruto da vistoria (sobe pro Google Drive, não fica no
    # banco) — precisa de limite bem maior que os outros endpoints, que só
    # trafegam JSON/base64 de fotos comprimidas.
    location = /vistoria-upload {
        client_max_body_size 250M;
        proxy_pass http://127.0.0.1:18791;
        include /etc/nginx/proxy_params_onboarding;
    }

    # Frontend estático (index.html, form.html, vistoria.html, css/, js/, img/)
    location / {
        try_files $uri $uri/ =404;
    }
}
