# Versão HTTP-only pra instalar ANTES do certbot (mesmo fluxo do
# onboarding.wecarehosting.com.br.conf) — rodar
# `certbot --nginx -d dev-onboarding.wecarehosting.com.br` depois de
# confirmar que este bloco funciona; o certbot reescreve o arquivo sozinho
# pra adicionar o server{} 443 + redirect 80→443.
#
# Ambiente de DEV — checkout separado (wecare-onboarding-staging), branch
# develop, backend numa porta própria (18794) com banco SQLite próprio.
# Allowlist explícita em vez do try_files $uri $uri/ =404 usado em produção —
# mesmo cuidado adotado no dev-claire.wecarehosting.com.br.conf pra não
# servir .git/deploy/etc sem querer.
server {
    listen 80;
    server_name dev-onboarding.wecarehosting.com.br;

    client_max_body_size 30M;

    root /home/jarvis/apps/wecare-onboarding-staging;
    index index.html;

    location ~ ^/(load|save|stats|onboarding-stats|form-load|form-save|vistoria-load|vistoria-save|vistoria-midia|imovel-dados|foto|imovel-fotos|jarvis-pending|jarvis-notify|extrair-formulario|analisar-drive|drive-debug)$ {
        proxy_pass http://127.0.0.1:18794;
        include /etc/nginx/proxy_params_onboarding;
    }

    location = / { try_files /index.html =404; }
    location = /index.html { try_files /index.html =404; }
    location = /form.html { try_files /form.html =404; }
    location = /vistoria.html { try_files /vistoria.html =404; }
    location /css/ { try_files $uri =404; }
    location /js/ { try_files $uri =404; }
    location /img/ { try_files $uri =404; }

    location / { return 404; }
}
